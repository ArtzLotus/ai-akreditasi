[project]
name = "akreditasi"
version = "0.1.0"
description = "Asisten Kesiapan Akreditasi Program Studi (LAM INFOKOM 2.1) - paket inti tahap 0"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1.5",
    "simpleeval>=1.0",
    "jsonschema>=4.23",
    "typer>=0.15",
    "structlog>=24",
    "rapidfuzz>=3.10",
    "polars>=1.10",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dokumen = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10",
]
model = [
    "openai>=1.50",
    "httpx>=0.27",
    "bm25s>=0.2",
]
tahap0 = ["streamlit>=1.40"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "procrastinate[psycopg]>=3.0",
    "authlib>=1.3",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "itsdangerous>=2.2",
    "prometheus-fastapi-instrumentator>=7.1",
    "prometheus-client>=0.21",
]
pdf = ["weasyprint>=62"]

[project.scripts]
akreditasi = "akreditasi.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.110",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akreditasi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = [
    "live: uji yang memanggil server model sungguhan (jalankan dengan -m live)",
    "db: uji integrasi PostgreSQL 18; dilewati bila AKREDITASI_TEST_DATABASE_URL kosong",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
